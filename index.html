<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Cartilha do Laboratório - LCA</title>
<link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;600&family=Poppins:wght@400;600&display=swap" rel="stylesheet">

<style>
body {
  font-family: 'Poppins', sans-serif;
  background-color: #f6ebd9;
  color: #2d2a26;
  margin: 0;
  padding: 0;
}

/* BANNER DE CABEÇALHO INTEGRADO */
header {
  width: 100%;
  background-color: #f6ebd9;
  text-align: center;
  padding-top: 10px;
}

.banner-topo {
  width: 100%;
  max-width: 1000px;
  height: auto;
  display: block;
  margin: 0 auto;
}

main {
  max-width: 900px;
  margin: 20px auto 40px;
  padding: 0 20px;
}

/* CARDS E CONTEÚDO */
.section-bncc {
  background-color: #fffbf3;
  border: 2px dashed #d8c4ad;
  border-radius: 16px;
  padding: 20px;
  margin-bottom: 20px;
}

.card-materia {
  background: #fffbf3;
  border-radius: 12px;
  margin-bottom: 10px;
  border: 1px solid #eae0d0;
  padding: 15px;
}
</style>
</head>

<body>

<header>
  <!-- Basta salvar a imagem do banner com o nome banner-topo.jpg na sua pasta -->
  <img src="banner-topo.jpg" alt="Cartilha do Laboratório LCA - EEM Ver. Oscar Manoel da Conceição" class="banner-topo">
</header>

<main>
  <section class="section-bncc">
    <h2>💻 O que é a BNCC da Computação?</h2>
    <p>Em 2023, o Ministério da Educação homologou o Complemento à BNCC para Computação, tornando o ensino de tecnologia parte oficial da educação básica brasileira.</p>
  </section>
</main>

</body>
</html>
